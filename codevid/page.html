<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body>
<script src="node_modules/three/build/three.min.js"></script>
<script src="kit/kit.js"></script>
<script>
  // load the scene file named in ?scene=..., then boot
  const src = new URLSearchParams(location.search).get('scene');
  const s = document.createElement('script');
  s.src = src;
  s.onload = () => { try { K.boot(); } catch (e) { window.bootError = String(e && e.stack || e); } };
  s.onerror = () => { window.bootError = 'could not load scene ' + src; };
  document.body.appendChild(s);
</script>
</body></html>
