<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script></head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
  import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
  window.THREE = THREE;
  window.ASSETS = {};
  window.GLTF = { SkeletonUtils, load: url => new Promise((ok, bad) => { const l = new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder); l.load(url, ok, undefined, bad); }) };
  window.POST = { EffectComposer, RenderPass, UnrealBloomPass, OutputPass };
  const load = src => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('could not load ' + src)); document.body.appendChild(s); });
  try {
    await load('kit/kit.js');
    await load(new URLSearchParams(location.search).get('scene'));
    await MeshoptDecoder.ready;
    for (const url of (window.SCENE.assets || [])) window.ASSETS[url] = await window.GLTF.load(url);   // 3D models, loaded before render
    window.sceneLoaded = true;          // render.js then calls K.boot(timing)
  } catch (e) { window.bootError = String(e && e.stack || e); }
</script>
</body></html>
